name: gold-bot
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install yfinance requests pandas
      - run: python bot.py
        env:
          BOT_TOKEN: ${{ 8562495673:AAFO93ZjJ4g6X9sQ3EbalRiNNZlsC3L3DJM }}
          CHAT_ID: ${{ 6842570365 }}
      - name: Save signals
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add signals.json
          git diff --staged --quiet || (git commit -m "update signals" && git push)